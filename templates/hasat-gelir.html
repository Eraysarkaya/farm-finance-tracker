<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasat Satışı Gelir</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="hasat-gelir-page">
    <div class="header">
        <div class="left">
            {% if session.get('user_id') %}
                <span>Hoş Geldiniz, {{ session.username }}</span>
            {% endif %}
        </div>
        <div class="right">
            {% if session.get('user_id') %}
                <a href="/logout" class="auth-button">Çıkış Yap</a>
            {% else %}
                <a href="/register" class="auth-button">Kayıt Ol</a>
                <a href="/login" class="auth-button">Giriş Yap</a>
            {% endif %}
            <a href="/index" class="auth-button">Anasayfa</a>
            <button class="auth-button" onclick="goBack()">Geri</button>
            <script>
                function goBack() {
                    if (document.referrer) {
                        // Bir önceki sayfa varsa geri git
                        window.history.back();
                    } else {
                        // Önceki sayfa yoksa bulunduğun sayfada kal
                        alert("Geri dönecek bir sayfa yok!");
                    }
                }
            </script>
        </div>
    </div>  

    <div class="main-container">
        <h1>Hasat Satışı Geliri</h1>
        <form action="/gelir/hasat?season={{ season_name }}&tarla_id={{ tarla_id }}" method="POST" class="hasat-form">
            <div class="form-group">
                <label for="miktar">Miktar (kg):</label>
                <div class="input-with-unit">
                    <input type="number" id="miktar" name="miktar" step="0.01" required>
                    <span class="unit">kg</span>
                </div>
            </div>
            <div class="form-group">
                <label for="tutar">Toplam Tutar (TL):</label>
                <div class="input-with-unit">
                    <input type="number" id="tutar" name="tutar" step="0.01" required>
                    <span class="unit">TL</span>
                </div>
            </div>
            <button type="submit" class="submit-button">Kaydet</button>
        </form>
    </div>
</body>
</html>
